<p>AERONOVA • CINEMATIC ANIMATED TRUE STORIES • Follow AERONOVA on social media for more extraordinary stories.</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=1080,H=1080,GR=540,INK='#1b1b1f';
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t,sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const HW=(s,b)=>(b?'700 ':'')+s+'px "Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS","Marker Felt",cursive;
const hx=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16)),mixc=(a,b,k)=>{const A=hx(a),B=hx(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],k))).join()+')'};

// moods: calm, tension, explosion, aftermath, hope  [sky top, sky bottom, ground]
const MO=[['#b8d4e8','#f0e6d0','#c4b896'],['#a0b8c8','#d4cfc0','#a89c80'],['#ff8844','#ffcc66','#d4a060'],['#4a4a5a','#6a6a7a','#5a5a5a'],['#ffe8b0','#fff5e0','#e8d8b0']];

// paper texture
const PP=document.createElement('canvas');PP.width=1080;PP.height=1080;(()=>{const p=PP.getContext('2d');let q=p.createRadialGradient(540,540,100,540,540,850);q.addColorStop(0,'#fbf3df');q.addColorStop(1,'#ecdcb8');p.fillStyle=q;p.fillRect(0,0,1080,1080);let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<5000;i++){p.fillStyle='rgba(120,90,50,'+(r()*.07)+')';p.fillRect(r()*1080,r()*1080,r()*3+1,r()*2+1)}p.strokeStyle='rgba(120,90,50,.06)';for(let i=0;i<30;i++){p.beginPath();p.moveTo(r()*1080,r()*1080);p.lineTo(r()*1080,r()*1080);p.stroke()}})();

// ===== STORY SCRIPT =====
const S=[
{k:'hook',m:2,cam:[1,1.1,640,380],snd:'boom',min:3,n:"December 6th, 1917. Halifax Harbor. Two ships collide. One is carrying five million pounds of explosives. In six minutes, a city will vanish."},
{k:'morning',m:0,cam:[1,1.05,640,400],cap:[[0,'Halifax, Nova Scotia'],[.4,'December 6, 1917'],[.75,'A cold morning']],n:"It was a cold December morning in Halifax, Nova Scotia. The harbor was busy with wartime traffic. Ships from across the world crowded the narrow channel. But no one knew what was coming."},
{k:'collision',m:1,cam:[1,1.12,620,420],cap:[[0,'The Mont-Blanc'],[.25,'Carrying 5 million pounds of TNT'],[.55,'The Imo'],[.8,'A collision course']],n:"The French ship Mont-Blanc was carrying a deadly secret — five million pounds of TNT and picric acid bound for the war in Europe. She was a floating bomb. And she was about to collide with the Norwegian ship Imo."},
{k:'impact',m:2,cam:[1,1.08,640,400],snd:'boom',cap:[[0,'The collision'],[.4,'Fire erupts'],[.7,'The crew flees']],n:"The ships collided in the narrows. Sparks ignited the Mont-Blanc's deck cargo. Fire erupted. The crew knew what was below deck — and they ran for their lives, screaming warnings in French that no one understood."},
{k:'drifting',m:1,cam:[1,1.1,640,420],cap:[[0,'The burning ship drifts'],[.5,'Toward the pier'],[.8,'People gather to watch']],n:"The burning ship drifted toward the pier. Hundreds of people gathered on the waterfront to watch. They thought it was just a fire. They had no idea that beneath the flames, the Mont-Blanc was a ticking clock."},
{k:'explosion',m:2,cam:[1,1.2,600,450],snd:'boom',big:'THE BLAST',bigY:180,bigS:100,cap:[[0,'9:04:35 AM'],[.3,'The Mont-Blanc detonates'],[.7,'A fireball a mile high']],n:"At 9:04 AM, the Mont-Blanc detonated. The explosion was so powerful it shattered windows in Truro — sixty miles away. A fireball rose a mile into the sky. The blast wave moved faster than sound."},
{k:'destruction',m:3,cam:[1,1.05,640,420],cap:[[0,'The north end of Halifax'],[.4,'Flattened'],[.75,'2,000 dead']],n:"The north end of Halifax was flattened. Houses were vaporized. A tsunami swept the harbor. Two thousand people died in an instant. Nine thousand were injured. It was the largest man-made explosion in history before the atomic bomb."},
{k:'heroes',m:0,cam:[1,1.08,640,420],cap:[[0,'But heroes emerged'],[.35,'Vince Coleman'],[.7,'A telegraph operator']],n:"But in the darkness, heroes emerged. A telegraph operator named Vince Coleman stayed at his post as the fire burned, sending warnings to stop trains from entering the city. His last message saved hundreds of lives. He did not survive."},
{k:'help',m:4,cam:[1,1.1,640,400],cap:[[0,'Boston sent help'],[.4,'Trainloads of supplies'],[.75,'A bond forever']],n:"Help came from everywhere. Boston sent a trainload of medical supplies and volunteers within hours. That bond between Halifax and Boston would last for generations. Every year, Halifax still sends Boston a Christmas tree."},
{k:'rebuild',m:4,cam:[1,1.05,640,380],big:'OUT OF ASHES',bigU:.35,bigY:200,bigS:72,cap:[[0,'Halifax rebuilt'],[.3,'Stronger than before'],[.65,'A city reborn']],n:"Halifax rebuilt. Stronger than before. The city rose from the ashes with a new determination. The explosion of 1917 could have destroyed them. Instead, it forged a community that would never be broken."},
{k:'moral',m:4,min:18,cam:[1,1.08,640,380],n:"Sometimes the worst moments bring out the best in us. Vince Coleman chose duty over safety. Boston chose compassion over distance. Halifax chose to rebuild instead of surrender. You too have that strength. Even when everything falls apart, your courage can light the way."},
{k:'outro',m:4,cam:[1.12,1.32,640,360],min:8,n:"For more true story animations — follow, subscribe, and share. See you in the next one!"}
];

const P={k:'poster',m:0,cam:[1,1,640,360],D:99};
S.forEach(b=>{b.D=Math.max(b.min||0,b.n.split(/\s+/).length/2.7+.6);b.ss=b.n.match(/[^.!?…]+(?:[.!?…]+[""]*|$)/g)||[b.n];b.v='f'});S[0].D=4.5;

// ---------- drawing helpers ----------
function halo(x,y,r,c,a){const q=g.createRadialGradient(x,y,4,x,y,r);q.addColorStop(0,'rgba('+c+','+a+')');q.addColorStop(1,'rgba('+c+',0)');g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2)}

function sea(t,sc,d,o){
  o=o||{};
  d=clamp(d,0,1);
  const q=g.createLinearGradient(0,0,0,GR);
  q.addColorStop(0,mixc('#8fb8d4','#1a1520',d));
  q.addColorStop(1,mixc('#f0e6d0','#4a2a28',d));
  g.fillStyle=q;g.fillRect(-100,-100,W+200,GR+100);
  if(d<.55)halo(o.sx||930,o.sy||170,260,'255,226,150',.5*(1-d*1.6));
  // clouds
  g.save();g.globalAlpha=.3;g.fillStyle=d>.5?'#3a2a2c':'#fff7e6';
  for(let i=0;i<6;i++){const x=((i*290+sc*.05+t*8)%1700+1700)%1700-220,y=70+(i%3)*58;[[0,0,70,24],[50,-10,60,28],[100,2,56,22]].forEach(([dx,dy,rx,ry])=>{g.beginPath();g.ellipse(x+dx,y+dy,rx,ry,0,0,7);g.fill()})}
  g.restore();
  // water
  const w=g.createLinearGradient(0,GR,0,H);
  w.addColorStop(0,mixc('#6a9ab8','#2a2530',d));
  w.addColorStop(1,mixc('#2a5570','#0e0a12',d));
  g.fillStyle=w;g.fillRect(-100,GR,W+200,H-GR+100);
  if(d>.3)halo(o.gx||640,GR+40,300,'255,110,40',.35*d);
  // waves
  g.lineWidth=2.5;
  for(let j=0;j<9;j++){
    const y0=GR+16+j*j*4.4,a=2+j*.9;
    g.strokeStyle=d>.5?'rgba(255,150,90,'+(.14+.02*j)+')':'rgba(255,255,255,'+(.16+.03*j)+')';
    g.beginPath();
    for(let x=-100;x<=W+100;x+=24){const yy=y0+Math.sin(x*.012+j-sc*.02+t*1.4)*a;x<-99?g.moveTo(x,yy):g.lineTo(x,yy)}
    g.stroke();
  }
  g.strokeStyle='rgba(40,40,40,.35)';g.lineWidth=2;g.beginPath();g.moveTo(-100,GR);g.lineTo(W+100,GR);g.stroke();
}

function waterFront(x,y,wd,t,d,sc,al){
  g.save();
  const wy=xx=>y+Math.sin(xx*.03+t*2.2-(sc||0)*.02)*4;
  g.fillStyle=mixc('#5a8aa5','#1a1820',clamp(d,0,1));
  g.globalAlpha=al==null?.8:al;
  g.beginPath();g.moveTo(x-wd,y+90);
  for(let i=0;i<=24;i++){const xx=x-wd+i*wd/12;g.lineTo(xx,wy(xx))}
  g.lineTo(x+wd,y+90);g.closePath();g.fill();
  g.globalAlpha=1;
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3;
  g.beginPath();
  for(let i=0;i<=24;i++){const xx=x-wd+i*wd/12;i?g.lineTo(xx,wy(xx)):g.moveTo(xx,wy(xx))}
  g.stroke();
  g.restore();
}

function flame(x,y,w,h,t,i){
  const f=1+Math.sin(t*9+i*2.3)*.16,sw=Math.sin(t*6+i)*w*.35;
  [['#d9482b',1],['#ff9c2e',.72],['#ffe27a',.42]].forEach(([c,k],j)=>{
    g.fillStyle=c;g.strokeStyle=INK;g.lineWidth=3;
    g.beginPath();
    g.moveTo(x-w*k,y);
    g.quadraticCurveTo(x-w*k*.95,y-h*k*.5*f,x+sw*k,y-h*k*f);
    g.quadraticCurveTo(x+w*k*.95,y-h*k*.45,x+w*k,y);
    g.closePath();g.fill();
    if(!j)g.stroke();
  });
}

function smoke(x,y,t,n,dark){
  for(let i=0;i<n;i++){
    const p=(t*.22+i/n)%1;
    g.fillStyle='rgba(45,40,42,'+(.5*(1-p)*dark)+')';
    g.beginPath();g.arc(x+p*150+Math.sin(i*3+t)*14,y-p*330,16+p*62,0,7);g.fill();
  }
}

// Draw a ship (generic)
function ship(x,y,s,o){
  o=o||{};
  const t=o.t||0,fire=o.fire||0,sink=o.sink||0,tilt=o.tilt||0;
  g.save();g.translate(x,y+sink+Math.sin(t*1.5)*4);g.rotate(tilt+Math.sin(t*1.1)*.012);g.scale(s,s);
  g.lineJoin=g.lineCap='round';
  // hull
  g.fillStyle='#2a2520';
  g.beginPath();
  g.moveTo(-200,-60);g.quadraticCurveTo(-196,-52,-190,-20);
  g.lineTo(-176,38);g.lineTo(150,38);
  g.quadraticCurveTo(190,15,220,-70);
  g.quadraticCurveTo(0,-48,-200,-60);g.closePath();g.fill();
  g.strokeStyle=INK;g.lineWidth=4;g.stroke();
  // deck
  g.fillStyle='#c4a878';
  g.fillRect(-160,-58,300,10);
  // cabin
  g.fillStyle='#d8c8a8';g.strokeStyle=INK;g.lineWidth=3;
  g.beginPath();g.roundRect(-80,-110,100,52,4);g.fill();g.stroke();
  g.fillStyle='#3a4a58';
  [-60,-40,-20,0,20].forEach(wx=>g.fillRect(wx,-100,12,14));
  // funnel
  g.fillStyle='#1a1a1a';g.beginPath();
  g.moveTo(-60,-110);g.lineTo(-56,-150);g.lineTo(-36,-150);g.lineTo(-32,-110);g.closePath();g.fill();g.stroke();
  // mast
  g.strokeStyle=INK;g.lineWidth=6;
  g.beginPath();g.moveTo(100,-58);g.lineTo(100,-170);g.stroke();
  g.strokeStyle='#d8c8a8';g.lineWidth=3;
  g.beginPath();g.moveTo(100,-58);g.lineTo(100,-170);g.stroke();
  // rigging
  g.strokeStyle='#3a3a30';g.lineWidth=1.5;
  g.beginPath();g.moveTo(100,-170);g.lineTo(160,-60);
  g.moveTo(100,-170);g.lineTo(40,-58);g.stroke();
  // fire
  if(fire>.05){
    [-40,0,40,80].forEach((fx,i)=>flame(fx,-60,20,(60+(i%3)*15)*fire,t,i));
    if(fire>.3){smoke(0,-150,t,3,fire);}
  }
  g.restore();
}

// Draw explosion
function explosion(x,y,t,u){
  const ph=clamp(u,0,1);
  halo(x,y,200+300*ph,'255,200,80',.9*(1-ph*.7));
  // fireball
  const r=30+ph*280;
  const q=g.createRadialGradient(x,y,10,x,y,r);
  q.addColorStop(0,'rgba(255,255,220,'+(1-ph*.6)+')');
  q.addColorStop(.3,'rgba(255,200,80,'+(1-ph*.7)+')');
  q.addColorStop(.6,'rgba(255,100,30,'+(1-ph*.8)+')');
  q.addColorStop(1,'rgba(80,20,10,0)');
  g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  // debris
  if(ph<.8){
    for(let i=0;i<20;i++){
      const an=i*.47+.2,dist=ph*(150+(i%5)*50);
      g.save();
      g.globalAlpha=clamp(1-ph/.8,0,1);
      g.translate(x+Math.cos(an)*dist,y+Math.sin(an)*dist*.7+ph*ph*80);
      g.rotate(i+t*5);
      g.fillStyle=i%2?'#55585e':'#ffb84a';
      g.fillRect(-8,-4,16,8);
      g.restore();
    }
  }
  // shockwave
  if(ph<.5){
    g.strokeStyle='rgba(255,255,220,'+(1-ph*2)+')';
    g.lineWidth=8*(1-ph*2)+2;
    g.beginPath();g.arc(x,y,40+ph*400,0,7);g.stroke();
  }
}

// ===== AERONIX NARRATOR CHARACTER =====
function Aeronix(x,y,s,t,explaining=true){
  g.save();g.translate(x,y);g.scale(s,s);g.lineCap='round';g.lineJoin='round';
  const ink='#101014',skin='#fffefa',shirt='#202024',blue='#527fa8',blueDark='#315a7b';
  // legs
  g.strokeStyle=ink;g.lineWidth=12;
  g.beginPath();g.moveTo(-38,-133);g.lineTo(-35,-28);g.moveTo(38,-133);g.lineTo(48,-28);g.stroke();
  g.strokeStyle=skin;g.lineWidth=7;
  g.beginPath();g.moveTo(-38,-134);g.lineTo(-35,-29);g.moveTo(38,-134);g.lineTo(48,-29);g.stroke();
  // sneakers
  function sneaker(cx,cy,rot){
    g.save();g.translate(cx,cy);g.rotate(rot);
    g.fillStyle=skin;g.strokeStyle=ink;g.lineWidth=5;

// ---------- cinematic atmosphere ----------
function cinematicFX(b,t,u){
  const dark=['hook','collision','impact','drifting','explosion','destruction'].includes(b.k);
  g.save();
  // vignette
  const vg=g.createRadialGradient(540,470,210,540,520,820);
  vg.addColorStop(0,'rgba(5,9,16,0)');
  vg.addColorStop(1,dark?'rgba(4,7,13,.7)':'rgba(37,24,12,.35)');
  g.fillStyle=vg;g.fillRect(0,0,1080,1080);
  // particles
  for(let i=0;i<46;i++){
    const seed=i*127.1+19.7,phase=(t*(dark?.16:.055)+(i*.071))%1;
    const x=(Math.sin(seed)*.5+.5)*1080+Math.sin(t*.7+i)*18;
    const y=dark?1080-phase*1160:((i*83+t*7)%1120);
    const r=dark?1.5+(i%4)*.75:1+(i%3)*.55;
    g.globalAlpha=dark?(1-phase)*(.18+(i%4)*.045):.12;
    g.fillStyle=dark?(i%3?'#ffb45c':'#ffe7ae'):'#e5edf2';
    g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  g.globalAlpha=1;
  // rain
  if(['hook','collision','impact','drifting','explosion','destruction'].includes(b.k)){
    g.strokeStyle='rgba(196,220,235,.19)';g.lineWidth=2;
    for(let i=0;i<75;i++){
      const x=(i*149+t*150)%1160-40,y=(i*97+t*360)%1120;
      g.beginPath();g.moveTo(x,y);g.lineTo(x-18,y+44);g.stroke();
    }
    // lightning
    const flash=(b.k==='explosion'&&u>.42&&u<.53)?(1-Math.abs(u-.475)/.055)*.7:
                (b.k==='hook'&&Math.sin(t*2.1)>.985?.22:0);
    if(flash>0){g.fillStyle='rgba(210,231,245,'+flash+')';g.fillRect(0,0,1080,1080)}
  }
  // warm rays for recovery
  if(['help','rebuild'].includes(b.k)){
    g.globalAlpha=.17;g.translate(540,240);g.rotate(-.25);
    for(let i=-5;i<=5;i++){
      g.fillStyle='#ffe1a0';
      g.beginPath();g.moveTo(i*78,0);g.lineTo(i*78-34,850);g.lineTo(i*78+34,850);g.closePath();g.fill();
    }
    g.restore();g.save();
  }
  // dramatic hook
  if(b.k==='hook'){
    const pulse=Math.max(0,1-t/1.05);
    g.strokeStyle='rgba(255,190,105,'+(.72*pulse)+')';
    g.lineWidth=5+18*(1-pulse);
    g.beginPath();g.arc(540,565,95+(1-pulse)*420,0,Math.PI*2);g.stroke();
    const flash=Math.max(0,1-t/.22);
    if(flash){g.fillStyle='rgba(255,238,205,'+(.72*flash)+')';g.fillRect(0,0,1080,1080)}
    const title=(txt,y,size,alpha,color)=>{
      g.save();g.globalAlpha=alpha;g.textAlign='center';g.textBaseline='middle';
      g.font='400 '+size+'px Georgia,"Times New Roman",serif';
      g.shadowColor='rgba(0,0,0,.72)';g.shadowBlur=10;g.shadowOffsetY=3;
      g.fillStyle=color;g.fillText(txt,540,y);g.restore();
    };
    const plateAlpha=clamp((t-.04)/.22,0,1)*(1-clamp((t-3.45)/.45,0,1));
    g.save();g.globalAlpha=.72*plateAlpha;g.fillStyle='rgba(3,8,16,.76)';
    g.fillRect(105,92,870,218);g.strokeStyle='rgba(255,205,126,.78)';g.lineWidth=3;g.strokeRect(105,92,870,218);g.restore();
    if(t>.10)title('DECEMBER 6, 1917',158,58,clamp((t-.10)/.24,0,1),'#F2E9D8');
    if(t>.62)title('HALIFAX VANISHES',247,76,clamp((t-.62)/.28,0,1),'#E6A15B');
  }
  g.restore();
}

function lines(txt,max){
  const ls=[];let l='';
  txt.split(' ').forEach(w=>{
    const v=l?l+' '+w:w;
    if(g.measureText(v).width>max&&l){ls.push(l);l=w}else l=v
  });
  ls.push(l);return ls;
}
function hud(b){
  if(!story.on)return;
  const t=story.bt;
  if(b.cap){
    let c=null;
    for(const x of b.cap)if(t>=x[0]*b.D)c=x;
    if(c){
      g.save();g.globalAlpha=clamp((t-c[0]*b.D)/.7,0,1);
      g.font=HW(32);g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
      g.lineWidth=10;g.strokeStyle='rgba(251,243,221,.85)';
      g.strokeText(c[1],540,62);g.fillStyle='#46423b';g.fillText(c[1],540,62);
      g.restore();
    }
  }
  const at=b.bigAt!=null?b.bigAt:b.bigU!=null?b.bigU*b.D:null;
  if(b.big&&at!=null&&t>=at){
    const a=clamp((t-at)/.8,0,1),sz=b.bigS||70;
    if(!b._b){b._b=1;sfx('hit')}
    g.save();g.globalAlpha=a;g.translate(540,b.bigY||170);
    g.scale(1+.06*(1-a),1+.06*(1-a));
    g.font=HW(sz,1);g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    const ls=b.big.split('\n');
    ls.forEach((l,i)=>{
      const y=(i-(ls.length-1)/2)*sz*1.1;
      g.lineWidth=14;g.strokeStyle='rgba(251,243,221,.85)';g.strokeText(l,0,y);
      g.fillStyle='#46423b';g.fillText(l,0,y);
    });
    g.restore();
  }
  if(b.k==='moral'){
    const BT=[
      [0,['SOMETIMES THE WORST','MOMENTS']],
      [.09,['BRING OUT THE','BEST IN US.']],
      [.27,['VINCE COLEMAN','CHOSE DUTY.']],
      [.45,['BOSTON CHOSE','COMPASSION.']],
      [.6,['HALIFAX CHOSE','TO REBUILD.']],
      [.75,['YOU HAVE','THAT STRENGTH.']],
      [.87,['YOUR COURAGE','CAN LIGHT THE WAY.']]
    ];
    let ci=0;BT.forEach((x,i)=>{if(t>=x[0]*b.D)ci=i});
    const bt=BT[ci],tt=t-bt[0]*b.D,last=ci===BT.length-1;
    if(b._i!==ci){b._i=ci;sfx(last?'chime':'hit')}
    g.save();
    const vg=g.createRadialGradient(540,540,260,540,540,820);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(10,6,8,'+(.55*(1-.7*clamp((t/b.D-.6)/.3,0,1)))+')');
    g.fillStyle=vg;g.fillRect(0,0,1080,1080);
    const a=clamp(tt/.45,0,1),sz=last?66:54;
    g.globalAlpha=a;g.translate(715,380);
    g.scale(1+.12*(1-a),1+.12*(1-a));
    g.font=HW(sz,1);g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    bt[1].forEach((l,i)=>{
      const y=(i-(bt[1].length-1)/2)*sz*1.2;
      g.lineWidth=16;g.strokeStyle='rgba(20,12,14,.88)';g.strokeText(l,0,y);
      g.fillStyle=last?'#ffd36a':'#fff6e2';g.fillText(l,0,y);
    });
    g.restore();
  }
  if(SUB){
    const ss=b.ss,tot=b.n.length,f=clamp(t/b.D,0,.999)*tot;
    let acc=0,idx=ss.length-1;
    for(let i=0;i<ss.length;i++){acc+=ss[i].length;if(f<acc){idx=i;break}}
